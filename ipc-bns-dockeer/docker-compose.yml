version: "3.8"

services:

  frontend:
    build: ./frontend
    container_name: ipc-bns-frontend

    ports:
      - "3000:3000"

    environment:
     - N8N_WEBHOOK_1=http://n8n:5678/webhook/analyze-document

    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n

    container_name: ipc-bns-n8n

    ports:
      - "5678:5678"

    volumes:
      - ./n8n_data:/home/node/.n8n